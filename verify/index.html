<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EKINTABULE Ticket</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#1a0a0a;color:#fff;font-family:system-ui,sans-serif;text-align:center}
.c{padding:32px;border-radius:20px;max-width:340px;width:88%;border:2px solid #FFD700;background:rgba(139,69,19,.3)}h1{color:#FFD700;margin:0 0 6px}p{opacity:.85}.big{font-size:56px}</style></head>
<body><div class="c"><div class="big" id="i">⏳</div><h1 id="t">Checking…</h1><p id="m"></p><p><small>🎄 EKINTABULE Kya Christmas · Gate staff will validate your ticket at entry.</small></p></div>
<script src="../shared/firebase-config.js"></script>
<script>
// READ-ONLY: never changes a ticket. Only gate staff (signed in) can mark entry.
(async()=>{const s=(i,t,m)=>{document.getElementById('i').textContent=i;document.getElementById('t').textContent=t;document.getElementById('m').textContent=m};
 const tok=new URLSearchParams(location.search).get('t')||'';
 if(!/^[a-f0-9]{32}$/.test(tok)) return s('🎫','No ticket','Scan your ticket QR code to see its status.');
 try{const d=await db.collection('qr').doc(tok).get();
  if(!d.exists) s('❌','Not recognised','This ticket is not in our system.');
  else if(d.data().used) s('⚠️','Already used','This ticket has already been scanned at the gate.');
  else s('✅','Valid ticket','Show this QR at the gate. Do not share it.');
 }catch(e){s('📡','Connection problem','Please try again.')}})();
</script></body></html>
